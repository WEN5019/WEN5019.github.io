<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122e2a">
  <meta name="description" content="高雄市鳳山區 YouBike 2.0 即時站點、可借車輛與低車量提醒。">
  <title>鳳山區單車看板｜YouBike 即時資訊</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172c29;
      --muted: #75837f;
      --canvas: #f3f5f1;
      --paper: #fff;
      --line: #e7ebe6;
      --green: #147d69;
      --green-dark: #122e2a;
      --mint: #e4f2ec;
      --orange: #d85c3a;
      --orange-soft: #fff0e9;
      --yellow: #f0c65d;
      --shadow: 0 16px 42px rgba(20, 44, 39, .055);
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 800; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: #fff; background: var(--green-dark); }
    .brand-mark svg { width: 23px; height: 23px; }
    .top-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .live-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid #cfe5d9; border-radius: 999px; color: #26715f; background: #f5fbf7; font-weight: 750; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #32aa77; box-shadow: 0 0 0 4px rgba(50,170,119,.12); }
    .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(230px, .6fr); gap: 30px; align-items: end; overflow: hidden; min-height: 232px; padding: 32px 38px; border-radius: 24px; color: #f6f8f4; background: var(--green-dark); box-shadow: var(--shadow); }
    .hero::after { content: ""; position: absolute; width: 430px; height: 430px; right: 17%; top: -270px; border: 1px solid rgba(231,241,220,.12); border-radius: 50%; box-shadow: 0 0 0 35px rgba(231,241,220,.025), 0 0 0 72px rgba(231,241,220,.025); pointer-events: none; }
    .hero-copy, .hero-side { position: relative; z-index: 1; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: #b7d7c6; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow .number { color: var(--yellow); }
    h1 { margin: 13px 0 9px; font-size: clamp(32px, 4.2vw, 52px); line-height: 1.14; letter-spacing: -.04em; }
    .hero-copy p { margin: 0; color: #c5d3cd; font-size: 14px; line-height: 1.7; }
    .hero-side { justify-self: end; width: min(100%, 278px); padding: 17px 19px; border: 1px solid rgba(230,242,234,.15); border-radius: 17px; background: rgba(255,255,255,.06); backdrop-filter: blur(6px); }
    .hero-side-label { margin-bottom: 7px; color: #a9c7b7; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .hero-side strong { display: block; font-size: 20px; line-height: 1.35; }
    .hero-side small { display: block; margin-top: 6px; color: #c5d3cd; font-size: 11px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 30px 2px 14px; }
    .section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .update-info { color: var(--muted); font-size: 11px; text-align: right; }
    .update-info strong { color: var(--ink); font-weight: 750; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .metric { position: relative; min-height: 130px; padding: 19px 20px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: var(--shadow); }
    .metric-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .metric-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 11px; color: var(--green); background: var(--mint); }
    .metric-icon svg { width: 17px; height: 17px; }
    .metric strong { display: block; margin-top: 14px; font-size: 32px; line-height: 1; letter-spacing: -.04em; }
    .metric strong span { margin-left: 4px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .metric .subline { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .metric.alert { border-color: #f5d1c4; background: #fffaf7; }
    .metric.alert .metric-icon { color: var(--orange); background: var(--orange-soft); }
    .metric.alert strong, .metric.alert .subline strong { color: var(--orange); }
    .insights { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .8fr); gap: 14px; margin-top: 14px; }
    .panel { min-width: 0; padding: 21px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .panel-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .panel-title h3 { margin: 0; font-size: 14px; }
    .panel-title p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .legend { display: flex; align-items: center; gap: 7px; padding-top: 2px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .chart-wrap { height: 191px; margin-top: 10px; }
    #trend-chart { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart-grid { stroke: #edf0ed; stroke-width: 1; }
    .chart-area { fill: url(#area-fill); }
    .chart-line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-point { fill: #fff; stroke: var(--green); stroke-width: 2.5; }
    .chart-label { fill: #899590; font: 10px Inter, "Noto Sans TC", sans-serif; }
    .chart-empty { fill: #85918d; font: 12px Inter, "Noto Sans TC", sans-serif; }
    .trend-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 3px; color: var(--muted); font-size: 10px; }
    .leaders { display: grid; gap: 15px; margin-top: 20px; }
    .leader { display: grid; grid-template-columns: 27px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    .leader-rank { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 9px; color: #397c69; background: #edf6f1; font-size: 11px; font-weight: 800; }
    .leader-info { min-width: 0; }
    .leader-name { overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .leader-near { margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .leader-track { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: #edf1ed; }
    .leader-track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #62b79b, var(--green)); }
    .leader-count { color: var(--green); font-size: 17px; font-weight: 850; white-space: nowrap; }
    .leader-count small { margin-left: 3px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .stations-section { margin-top: 31px; }
    .stations-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 0 2px 14px; }
    .stations-heading h2 { margin: 0; font-size: 18px; }
    .stations-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .station-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .tools { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .searchbox { position: relative; flex: 1; min-width: 150px; }
    .searchbox svg { position: absolute; top: 50%; left: 13px; width: 16px; height: 16px; color: #8c9892; transform: translateY(-50%); pointer-events: none; }
    .searchbox input { width: 100%; height: 42px; padding: 0 14px 0 39px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: #fff; color: var(--ink); font-size: 12px; }
    .searchbox input:focus, select:focus { border-color: #84bdab; box-shadow: 0 0 0 3px rgba(20,125,105,.1); }
    .tools select { height: 42px; padding: 0 34px 0 12px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: #fff; color: #51605b; font-size: 11px; }
    .tool-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 13px; border: 1px solid #c9dfd5; border-radius: 12px; color: #26715f; background: #f8fcf9; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .tool-button:hover { background: #edf7f1; }
    .tool-button svg { width: 15px; height: 15px; }
    .station-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .station { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 15px; min-height: 106px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); transition: border-color .15s, transform .15s; }
    .station:hover { border-color: #cbdcd4; transform: translateY(-1px); }
    .station.low { border-color: #f1c7b8; background: #fffaf7; }
    .station.offline { opacity: .72; }
    .station-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .station-title { overflow: hidden; font-size: 13px; font-weight: 780; text-overflow: ellipsis; white-space: nowrap; }
    .station-tag { flex: none; padding: 4px 7px; border-radius: 6px; color: #b3492f; background: #ffe6dc; font-size: 9px; font-weight: 800; }
    .station-tag.off { color: #65716c; background: #e9eeeb; }
    .station-address { margin-top: 6px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .station-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; color: #83908a; font-size: 10px; }
    .station-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .station-meta b { color: #4f615b; font-weight: 700; }
    .bike-count { min-width: 72px; text-align: right; }
    .bike-count strong { display: block; color: var(--green); font-size: 27px; line-height: 1; letter-spacing: -.05em; }
    .station.low .bike-count strong { color: var(--orange); }
    .bike-count small { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
    .bar { width: 70px; height: 4px; margin: 9px 0 0 auto; overflow: hidden; border-radius: 8px; background: #e9eeeb; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .station.low .bar i { background: var(--orange); }
    .empty-state { grid-column: 1 / -1; padding: 35px 18px; border: 1px dashed #d8e0db; border-radius: 15px; color: var(--muted); background: rgba(255,255,255,.55); font-size: 12px; text-align: center; }
    .skeleton { min-height: 106px; border: 1px solid var(--line); border-radius: 15px; background: linear-gradient(100deg, #fff 20%, #f1f4f1 40%, #fff 60%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { background-position-x: -200%; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice { display: none; margin: 11px 0 0; padding: 11px 14px; border: 1px solid #f0d7a0; border-radius: 11px; color: #795b1e; background: #fff9e8; font-size: 11px; line-height: 1.55; }
    .notice.show { display: block; }
    .footer { display: flex; justify-content: space-between; gap: 15px; margin-top: 27px; padding: 18px 2px 0; border-top: 1px solid #e2e8e3; color: var(--muted); font-size: 10px; line-height: 1.7; }
    .footer strong { color: #50615b; }
    .footer a { color: #28725f; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 850px) {
      .page { width: min(100% - 32px, 720px); padding-top: 19px; }
      .hero { grid-template-columns: 1fr; gap: 20px; padding: 28px; }
      .hero-side { justify-self: start; width: min(100%, 360px); }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .insights { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .page { width: calc(100% - 24px); padding: 13px 0 30px; }
      .topbar { align-items: flex-start; margin-bottom: 14px; }
      .brand { gap: 8px; font-size: 12px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 11px; }
      .top-meta { align-items: flex-end; flex-direction: column; gap: 5px; font-size: 10px; }
      .live-pill { padding: 6px 9px; font-size: 10px; }
      .hero { min-height: 0; gap: 18px; padding: 23px 20px; border-radius: 19px; }
      .hero::after { right: -170px; top: -310px; }
      .eyebrow { font-size: 10px; }
      h1 { margin-top: 12px; font-size: 34px; }
      .hero-copy p { max-width: 300px; font-size: 12px; }
      .hero-side { padding: 13px 15px; }
      .hero-side strong { font-size: 17px; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 8px; margin-top: 24px; }
      .update-info { text-align: left; }
      .metric { min-height: 114px; padding: 14px; border-radius: 14px; }
      .metric-label { font-size: 10px; }
      .metric-icon { width: 27px; height: 27px; border-radius: 9px; }
      .metric strong { margin-top: 12px; font-size: 28px; }
      .metric .subline { margin-top: 6px; font-size: 9px; }
      .insights { gap: 10px; margin-top: 10px; }
      .panel { padding: 17px 15px; border-radius: 15px; }
      .chart-wrap { height: 168px; }
      .stations-section { margin-top: 24px; }
      .stations-heading { align-items: flex-start; }
      .stations-heading h2 { font-size: 16px; }
      .stations-heading p { font-size: 10px; }
      .tools { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
      .searchbox { grid-column: 1 / -1; }
      .tools select { width: 100%; }
      .tool-button { padding: 0 10px; }
      .station-grid { grid-template-columns: 1fr; gap: 8px; }
      .station { min-height: 96px; padding: 13px 14px; }
      .station-title { font-size: 12px; }
      .station-address { font-size: 9px; }
      .station-meta { gap: 8px; font-size: 9px; }
      .footer { flex-direction: column; gap: 8px; margin-top: 22px; font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="m6 17 4-8h3l5 8m-8-8 4 8m-3-11h3"/></svg>
        </span>
        <span>鳳山單車生活圈</span>
      </div>
      <div class="top-meta">
        <span class="live-pill"><i class="live-dot" aria-hidden="true"></i><span id="live-label">連線中</span></span>
        <span>資料每 10 分鐘更新</span>
      </div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <div class="eyebrow"><span class="number">#06</span><span>高雄・鳳山區</span><span>／</span><span>youbike 2.0</span></div>
        <h1 id="page-title">出門前，先看<br>哪裡有車。</h1>
        <p>騎車接捷運的鳳山日常，從附近站點的即時車況開始。</p>
      </div>
      <div class="hero-side">
        <div class="hero-side-label">目前最有車</div>
        <strong id="best-station">等待即時資料…</strong>
        <small id="best-station-meta">依可借車數排序的鳳山站點</small>
      </div>
    </section>

    <section aria-labelledby="overview-title">
      <div class="section-head">
        <div><h2 id="overview-title">鳳山即時概況</h2><p>只統計高雄市鳳山區站點</p></div>
        <div class="update-info">資料更新於 <strong id="source-updated">—</strong><br>本頁擷取 <strong id="fetched-at">等待資料</strong></div>
      </div>
      <div class="metrics" aria-live="polite">
        <article class="metric">
          <div class="metric-label">目前可借車輛<span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="m6 17 4-8h3l5 8m-8-8 4 8m-3-11h3"/></svg></span></div>
          <strong id="metric-bikes">—<span>台</span></strong><div class="subline">所有鳳山站點合計</div>
        </article>
        <article class="metric">
          <div class="metric-label">服務站點<span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.3"/></svg></span></div>
          <strong id="metric-stations">—<span>站</span></strong><div class="subline" id="active-caption">營運中的站點</div>
        </article>
        <article class="metric alert">
          <div class="metric-label">低於 5 台<span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg></span></div>
          <strong id="metric-low">—<span>站</span></strong><div class="subline">包含暫停服務站點，請留意標示</div>
        </article>
        <article class="metric">
          <div class="metric-label">可還車位<span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M12 4l8 8-8 8"/></svg></span></div>
          <strong id="metric-docks">—<span>格</span></strong><div class="subline">所有鳳山站點合計</div>
        </article>
      </div>
    </section>

    <section class="insights" aria-label="車況圖表">
      <article class="panel">
        <div class="panel-title"><div><h3>鳳山可借車輛趨勢</h3><p>記錄此頁開啟後的更新變化，最多保留 24 筆</p></div><div class="legend"><i aria-hidden="true"></i>可借車輛</div></div>
        <div class="chart-wrap"><svg id="trend-chart" viewBox="0 0 700 190" role="img" aria-label="鳳山區可借車輛變化折線圖"></svg></div>
        <div class="trend-foot"><span id="trend-range">第一次讀取後開始記錄</span><span id="trend-points">0 筆資料</span></div>
      </article>
      <article class="panel">
        <div class="panel-title"><div><h3>捷運通勤・車多站點</h3><p>優先列出名稱含「捷運」且目前有車的站點</p></div></div>
        <div class="leaders" id="leaders"><div class="empty-state">等待站點資料</div></div>
      </article>
    </section>

    <section class="stations-section" aria-labelledby="station-list-title">
      <div class="stations-heading">
        <div><h2 id="station-list-title">站點即時車況</h2><p>少於 5 台以橘紅色提醒；點「附近優先」可依距離排列</p></div>
        <div class="station-count" id="station-count">載入站點中…</div>
      </div>
      <div class="tools">
        <label class="searchbox"><span class="sr-only">搜尋站名或地址</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜尋站名或地址" autocomplete="off"></label>
        <label><span class="sr-only">站點篩選</span><select id="filter"><option value="all">全部站點</option><option value="with-bikes">目前有車</option><option value="low">低於 5 台</option><option value="metro">捷運站點</option></select></label>
        <button class="tool-button" id="nearby-button" type="button" title="使用裝置位置，將近的站點排在前面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.3"/><path d="M12 1.5v3m0 15v3m10.5-10.5h-3m-15 0h-3"/></svg><span id="nearby-label">附近優先</span></button>
        <button class="tool-button" id="refresh-button" type="button" title="立即重新讀取資料"><svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18 6.2L20 12M4 12l2 5.8A7 7 0 0 0 18.2 15"/></svg><span>更新</span></button>
      </div>
      <div class="station-grid" id="station-grid" aria-live="polite" aria-busy="true">
        <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
        <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
      </div>
      <div class="notice" id="notice" role="status"></div>
    </section>

    <footer class="footer">
      <div><strong>資料來源：</strong><a href="https://openapi.kcg.gov.tw/Api/Service/Get/b4dd9c40-9027-4125-8666-06bef1756092" target="_blank" rel="noreferrer">高雄市政府交通局・高雄市 YouBike2.0 即時資訊</a> ・ <a href="https://data.gov.tw/dataset/173477" target="_blank" rel="noreferrer">資料集說明</a><br>資料約每 10 分鐘更新；實際車況以 YouBike 官方資訊為準。</div>
      <div><strong>資通四勤　121271008　林文皓</strong><br>鳳山區單車看板</div>
    </footer>
  </main>

  <script>
    (() => {
      const API_URL = "https://openapi.kcg.gov.tw/Api/Service/Get/b4dd9c40-9027-4125-8666-06bef1756092";
      const REFRESH_MS = 10 * 60 * 1000;
      const HISTORY_KEY = "fengshan-youbike-history-v1";
      const $ = (id) => document.getElementById(id);
      const state = { stations: [], location: null, history: readHistory(), loading: false, timer: null };
      const number = (value) => {
        const parsed = Number.parseInt(String(value ?? "").replace(/,/g, ""), 10);
        return Number.isFinite(parsed) ? parsed : 0;
      };
      const stationName = (value) => String(value || "未命名站點").replace(/^YouBike2\.0[_\s]*/, "");
      const isActive = (value) => value === true || value === 1 || value === "1";
      const timeText = (date) => new Intl.DateTimeFormat("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
      const fullTimeText = (date) => new Intl.DateTimeFormat("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
      const safeText = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      const setNotice = (message = "") => { const notice = $("notice"); notice.textContent = message; notice.classList.toggle("show", Boolean(message)); };

      function readHistory() {
        try {
          const value = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(value) ? value.filter((item) => Number.isFinite(item?.at) && Number.isFinite(item?.bikes)).slice(-24) : [];
        } catch { return []; }
      }

      function saveHistory() {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(-24))); } catch { /* Private browsing can disable storage. */ }
      }

      function extractPayload(json) {
        const root = json?.data?.data ?? json?.data ?? json;
        const rows = root?.retVal ?? json?.data?.retVal ?? json?.retVal;
        if (!Array.isArray(rows)) throw new Error("資料格式與預期不同，找不到 retVal 站點陣列。");
        return { root, rows };
      }

      function normalizeRows(rows) {
        return rows.filter((row) => row?.scity === "高雄市" && row?.sarea === "鳳山區").map((row) => ({
          id: String(row.sno ?? `${row.sna}-${row.ar}`),
          name: stationName(row.sna),
          address: String(row.ar || "地址未提供"),
          bikes: number(row.sbi),
          docks: number(row.bemp),
          capacity: number(row.tot),
          active: isActive(row.act),
          updated: String(row.mday || ""),
          lat: Number(row.lat),
          lng: Number(row.lng)
        }));
      }

      function recordSnapshot(stations, fetchedAt) {
        const bikes = stations.reduce((sum, station) => sum + station.bikes, 0);
        const low = stations.filter((station) => station.bikes < 5).length;
        const last = state.history[state.history.length - 1];
        const snapshot = { at: fetchedAt.getTime(), bikes, low };
        if (last && snapshot.at - last.at < 60_000) state.history[state.history.length - 1] = snapshot;
        else state.history.push(snapshot);
        state.history = state.history.slice(-24);
        saveHistory();
      }

      async function fetchData(manual = false) {
        if (state.loading) return;
        state.loading = true;
        $("live-label").textContent = "更新中";
        $("refresh-button").disabled = true;
        $("refresh-icon").style.animation = "spin .8s linear infinite";
        try {
          const response = await fetch(API_URL, { cache: "no-store", headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(`資料端點回應 ${response.status}`);
          const json = await response.json();
          const { root, rows } = extractPayload(json);
          const stations = normalizeRows(rows);
          if (!stations.length) throw new Error("資料中沒有找到鳳山區站點，請稍後重試。");
          state.stations = stations;
          const fetchedAt = new Date();
          recordSnapshot(stations, fetchedAt);
          const updated = root.updated_at || json?.data?.updated_at || json?.updated_at;
          $("source-updated").textContent = updated ? String(updated).replace("T", " ") : "資料端未提供";
          $("fetched-at").textContent = timeText(fetchedAt);
          $("live-label").textContent = "即時連線";
          setNotice("");
          render();
        } catch (error) {
          $("live-label").textContent = state.stations.length ? "資料暫未更新" : "連線失敗";
          setNotice(`${error.message || "無法讀取即時資料。"} 請確認網路連線，或按「更新」重試。`);
          if (manual && !state.stations.length) $("station-grid").innerHTML = '<div class="empty-state">暫時無法載入站點，請稍後再試。</div>';
        } finally {
          state.loading = false;
          $("refresh-button").disabled = false;
          $("refresh-icon").style.animation = "";
          $("station-grid").setAttribute("aria-busy", "false");
        }
      }

      function haversine(lat1, lng1, lat2, lng2) {
        const rad = (degrees) => degrees * Math.PI / 180;
        const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
        return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function filteredStations() {
        const query = $("search").value.trim().toLocaleLowerCase("zh-TW");
        const filter = $("filter").value;
        let result = state.stations.filter((station) => {
          const matchesText = !query || `${station.name} ${station.address} ${station.id}`.toLocaleLowerCase("zh-TW").includes(query);
          const matchesFilter = filter === "all" || (filter === "with-bikes" && station.bikes > 0 && station.active) || (filter === "low" && station.bikes < 5) || (filter === "metro" && station.name.includes("捷運"));
          return matchesText && matchesFilter;
        });
        if (state.location) {
          result = result.map((station) => ({ ...station, distance: Number.isFinite(station.lat) && Number.isFinite(station.lng) ? haversine(state.location.lat, state.location.lng, station.lat, station.lng) : Infinity }));
          result.sort((a, b) => a.distance - b.distance || b.bikes - a.bikes);
        } else {
          result.sort((a, b) => (Number(b.active) - Number(a.active)) || (b.bikes - a.bikes) || a.name.localeCompare(b.name, "zh-TW"));
        }
        return result;
      }

      function renderStations() {
        const list = filteredStations();
        $("station-count").textContent = `顯示 ${list.length} / ${state.stations.length} 站`;
        const grid = $("station-grid");
        if (!list.length) {
          grid.innerHTML = '<div class="empty-state">找不到符合條件的站點，換個關鍵字或篩選條件看看。</div>';
          return;
        }
        grid.innerHTML = list.map((station) => {
          const low = station.bikes < 5;
          const percentage = station.capacity > 0 ? Math.max(0, Math.min(100, station.bikes / station.capacity * 100)) : 0;
          const distance = Number.isFinite(station.distance) ? `${station.distance < 1 ? Math.round(station.distance * 1000) + " 公尺" : station.distance.toFixed(1) + " 公里"}` : "";
          const tags = `${low ? '<span class="station-tag">低車量</span>' : ""}${station.active ? "" : '<span class="station-tag off">暫停服務</span>'}`;
          return `<article class="station${low ? " low" : ""}${station.active ? "" : " offline"}">
            <div><div class="station-title-row"><div class="station-title" title="${safeText(station.name)}">${safeText(station.name)}</div>${tags}</div>
              <div class="station-address" title="${safeText(station.address)}">${safeText(station.address)}</div>
              <div class="station-meta"><span>可還 <b>${station.docks}</b></span><span>總車位 <b>${station.capacity}</b></span>${distance ? `<span>距離 <b>${distance}</b></span>` : ""}</div>
            </div><div class="bike-count"><strong>${station.bikes}</strong><small>可借車輛</small><div class="bar" aria-hidden="true"><i style="width:${percentage}%"></i></div></div>
          </article>`;
        }).join("");
      }

      function renderLeaders() {
        const leaders = state.stations.filter((station) => station.active && station.bikes > 0 && station.name.includes("捷運")).sort((a, b) => b.bikes - a.bikes).slice(0, 4);
        const target = $("leaders");
        if (!leaders.length) {
          target.innerHTML = '<div class="empty-state">目前沒有可借車輛的捷運站點</div>';
          return;
        }
        const maximum = Math.max(1, ...leaders.map((station) => station.bikes));
        target.innerHTML = leaders.map((station, index) => {
          const percent = Math.round(station.bikes / maximum * 100);
          return `<div class="leader"><span class="leader-rank">${String(index + 1).padStart(2, "0")}</span><div class="leader-info"><div class="leader-name" title="${safeText(station.name)}">${safeText(station.name)}</div><div class="leader-near">${safeText(station.address)}</div><div class="leader-track" aria-label="可借車數相對比例 ${percent}%"><i style="width:${percent}%"></i></div></div><div class="leader-count">${station.bikes}<small>台</small></div></div>`;
        }).join("");
      }

      function renderTrend() {
        const svg = $("trend-chart");
        const values = state.history.slice(-24);
        const width = 700, height = 190, pad = { top: 16, right: 18, bottom: 28, left: 43 };
        const chartWidth = width - pad.left - pad.right, chartHeight = height - pad.top - pad.bottom;
        if (!values.length) {
          svg.innerHTML = '<text class="chart-empty" x="350" y="95" text-anchor="middle">等待第一筆即時資料</text>';
          $("trend-range").textContent = "第一次讀取後開始記錄";
          $("trend-points").textContent = "0 筆資料";
          return;
        }
        const max = Math.max(10, ...values.map((item) => item.bikes));
        const step = values.length > 1 ? chartWidth / (values.length - 1) : 0;
        const points = values.map((item, index) => ({ x: values.length === 1 ? pad.left + chartWidth / 2 : pad.left + index * step, y: pad.top + chartHeight - (item.bikes / max) * chartHeight, ...item }));
        const linePath = points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
        const areaPath = `${linePath} L${points[points.length - 1].x.toFixed(1)},${(pad.top + chartHeight).toFixed(1)} L${points[0].x.toFixed(1)},${(pad.top + chartHeight).toFixed(1)} Z`;
        const yGrid = [0, .5, 1].map((ratio) => {
          const y = pad.top + ratio * chartHeight;
          const label = Math.round(max * (1 - ratio));
          return `<line class="chart-grid" x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}"/><text class="chart-label" x="${pad.left - 10}" y="${y + 3}" text-anchor="end">${label}</text>`;
        }).join("");
        const markers = points.map((point) => `<circle class="chart-point" cx="${point.x}" cy="${point.y}" r="${values.length > 14 ? 2.5 : 4}"><title>${new Date(point.at).toLocaleString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false })}・${point.bikes} 台</title></circle>`).join("");
        const xLabels = [points[0], points[Math.floor((points.length - 1) / 2)], points[points.length - 1]].filter((point, index, all) => all.findIndex((other) => other.x === point.x) === index).map((point) => `<text class="chart-label" x="${point.x}" y="${height - 6}" text-anchor="middle">${timeText(new Date(point.at))}</text>`).join("");
        svg.innerHTML = `<defs><linearGradient id="area-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#147d69" stop-opacity=".18"/><stop offset="100%" stop-color="#147d69" stop-opacity="0"/></linearGradient></defs>${yGrid}<path class="chart-area" d="${areaPath}"/><path class="chart-line" d="${linePath}"/>${markers}${xLabels}`;
        $("trend-range").textContent = values.length > 1 ? `${fullTimeText(new Date(values[0].at))} — ${timeText(new Date(values[values.length - 1].at))}` : "資料已開始記錄，等待下一次更新";
        $("trend-points").textContent = `${values.length} 筆資料`;
      }

      function render() {
        if (!state.stations.length) return;
        const totalBikes = state.stations.reduce((sum, station) => sum + station.bikes, 0);
        const totalDocks = state.stations.reduce((sum, station) => sum + station.docks, 0);
        const lowCount = state.stations.filter((station) => station.bikes < 5).length;
        const activeCount = state.stations.filter((station) => station.active).length;
        const best = state.stations.filter((station) => station.active).slice().sort((a, b) => b.bikes - a.bikes)[0];
        $("metric-bikes").innerHTML = `${totalBikes.toLocaleString("zh-TW")}<span>台</span>`;
        $("metric-stations").innerHTML = `${state.stations.length}<span>站</span>`;
        $("metric-low").innerHTML = `${lowCount}<span>站</span>`;
        $("metric-docks").innerHTML = `${totalDocks.toLocaleString("zh-TW")}<span>格</span>`;
        $("active-caption").textContent = `營運中 ${activeCount} 站`;
        $("best-station").textContent = best && best.bikes > 0 ? best.name : "目前沒有可借車輛";
        $("best-station-meta").textContent = best && best.bikes > 0 ? `${best.address} ・ ${best.bikes} 台可借` : "查看各站點最新狀態";
        renderLeaders(); renderTrend(); renderStations();
      }

      function locateNearby() {
        if (state.location) {
          state.location = null;
          $("nearby-label").textContent = "附近優先";
          renderStations();
          return;
        }
        if (!navigator.geolocation) { setNotice("這個瀏覽器不支援位置功能；仍可搜尋站名或地址。"); return; }
        $("nearby-label").textContent = "取得位置中…";
        navigator.geolocation.getCurrentPosition((position) => {
          state.location = { lat: position.coords.latitude, lng: position.coords.longitude };
          $("nearby-label").textContent = "取消距離排序";
          setNotice("");
          renderStations();
        }, (error) => {
          $("nearby-label").textContent = "附近優先";
          const message = error.code === 1 ? "尚未允許位置存取。你也可以直接搜尋站名或地址。" : "無法取得目前位置，請確認裝置定位設定。";
          setNotice(message);
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
      }

      $("search").addEventListener("input", renderStations);
      $("filter").addEventListener("change", renderStations);
      $("nearby-button").addEventListener("click", locateNearby);
      $("refresh-button").addEventListener("click", () => fetchData(true));
      window.addEventListener("online", () => fetchData());
      document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchData(); });
      fetchData();
      state.timer = window.setInterval(fetchData, REFRESH_MS);
    })();
  </script>
</body>
</html>
